name: Build & Release Artifacts (APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Generate APK, AAB & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK and AAB
      run: ./gradlew assembleDebug bundleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: FixitBhai-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v7
      with:
        name: FixitBhai-debug-aab
        path: app/build/outputs/bundle/debug/app-debug.aab

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/bundle/debug/app-debug.aab
        name: FixitBhai ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
